###############################################################################
# OpenWrt x86_64 自动构建
#
# 流程：
#   1. 读取版本号（VERSION 文件 / git tag / 手动输入）
#   2. 查 Docker Hub 上有没有 <用户名>/openwrt:<版本号>
#        - 有 → 直接跳过（版本号没变，不重复编译，秒级结束）
#        - 无 → 继续编译
#   3. 用 docker buildx 构建编译环境镜像（GHA 层缓存，依赖只装一次）
#   4. 在容器内编译 OpenWrt（dl 源码包 + ccache 走 actions/cache）
#        ⚠ 编译步骤带步骤级 timeout，超时时只判本步骤失败，作业继续走完
#          「保存缓存」和「上传日志」，避免整轮白跑。
#   5. 打包成 OpenWrt 系统镜像并推送到 Docker Hub
#   6. 刷机固件上传 Artifact / GitHub Release
#
# 触发方式（三选一即可）：
#   1. 推送到 main（推荐日常使用）
#   2. 打 tag：git tag v1.0.0 && git push origin v1.0.0
#   3. Actions 页面手动 Run workflow
#
# 依赖的环境配置（仓库 Settings → Environments → DOCKERHUB）：
#   Variables: DOCKERHUB_USERNAME   （Docker Hub 用户名/命名空间，明文变量）
#   Secrets:   DOCKERHUB_TOKEN      （Docker Hub Access Token，加密密钥）
###############################################################################
name: Build OpenWrt x86_64

on:
  # 手动触发（可在 Actions 页面点，可指定版本号 / 强制重建）
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（留空则用仓库根目录 VERSION 文件）'
        required: false
        default: ''
      force_rebuild:
        description: '强制重新编译（忽略 Docker Hub 上已存在的同名 tag）'
        required: false
        type: boolean
        default: false

  push:
    # 推送到 main 也触发。不用担心白跑：下面的"版本号闸门"会先查 Docker Hub
    # 上有没有同名 tag，有就直接跳过（秒级结束），只有版本号真的变了才编译。
    # 所以日常改 README、改脚本推上来，最多消耗十几秒的空跑。
    branches:
      - main
    # 打 tag 也触发（v1.0.0 这种），此时版本号取 tag 名去掉前缀 v
    tags:
      - 'v*'

permissions:
  contents: write

env:
  IMAGE_NAME: openwrt
  # 编译线程数不在这里写死：脚本直接取 runner 的 CPU 核心数。
  # 实测本 runner 是 2 vCPU / 7.75GiB（日志里 docker info 的 "CPUs: 2"），即 make -j2。
  # ⚠ 为什么不是 4 核：GitHub 对公开/私有仓库是**两张规格表** ——
  #     公开仓库 ubuntu-latest = 4 vCPU / 16 GB
  #     私有仓库 ubuntu-latest = 2 vCPU /  8 GB   ← 本仓库（私有）走这行
  #   想上 4 核只有三条路：把仓库改公开 / 用 larger runner（需 Team+ 计划、按分钟计费）
  #   / 自建 runner。换了机器这里不用改，脚本会自动跟着 nproc 走。
  # 需要手动压线程数时，在下面「在容器内编译 OpenWrt」步骤的 env 里加
  # BUILD_THREADS（例如 BUILD_THREADS: '1'）。
  #
  # ccache 上限。Actions 的缓存池是「整个仓库共用 10GB」，里面还要装
  # dl 源码包（实测 2.0G）和 buildx 的层缓存（约 1.2G）。
  #
  # 定 3G 的依据：第 2 轮构建跑到 264 分钟时 ccache 已攒到 1.1G，
  # 按比例一轮完整编译大约要 2~2.5G —— 2G 会在后半程撞上限并触发清理，
  # 那既浪费掉最该命中的对象，也让保存时的 tar 更容易遇到文件变动。
  # 3G×2 份（本次 + 上一份）+ dl 2G + buildx 1.2G ≈ 9.2G，仍在 10GB 以内。
  # 真要再腾空间，优先砍 dl 缓存：实测 make download -j8 只要 3 分钟，
  # 用 2GB 缓存池换 3 分钟很不划算。
  CCACHE_MAXSIZE: 3G
  # dl 源码包缓存的版本号。actions/cache 的条目是不可变的（写过就改不了），
  # 所以用固定 key + 手动改这个 epoch 来强制刷新。日常不用动它。
  DL_CACHE_EPOCH: v1
  # 编译失败时回填到 Actions 日志的尾部行数
  LOG_TAIL_LINES: '400'

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ⚠ 必须和「仓库 Settings → Environments」里配置的环境名完全一致，
    #   否则 vars.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN 取不到值
    environment: DOCKERHUB
    # GitHub 硬上限是 360 分钟，留一点余量。
    # ⚠ 这个值是「兜底」：真正会先触发的是编译步骤自己的 timeout-minutes，
    #   因为 job 级超时会把整个作业连同后面的保存缓存步骤一起取消掉。
    timeout-minutes: 355

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 版本号闸门
      # -----------------------------------------------------------------------
      - name: 解析版本号并检查 Docker Hub
        id: gate
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          # 取值失败时给出明确报错，否则后面会出现 "/openwrt:1.0.0" 这种诡异镜像名
          [ -n "${DOCKERHUB_USERNAME:-}" ] || {
            echo "::error::vars.DOCKERHUB_USERNAME 为空 → Settings → Environments → DOCKERHUB → Environment variables 中添加 DOCKERHUB_USERNAME"
            exit 1
          }
          [ -n "${DOCKERHUB_TOKEN:-}" ] || {
            echo "::error::secrets.DOCKERHUB_TOKEN 为空 → Settings → Environments → DOCKERHUB → Environment secrets 中添加 DOCKERHUB_TOKEN"
            exit 1
          }

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(tr -d ' \t\r\n' < VERSION)"
          fi
          [ -n "$VERSION" ] || { echo "::error::版本号为空"; exit 1; }

          IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

          echo "目标镜像: ${IMAGE}:${VERSION}"

          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            echo "::notice::force_rebuild=true，强制重新编译"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${VERSION}/" || echo 000)"
          echo "Docker Hub 查询返回 HTTP $CODE"

          if [ "$CODE" = "200" ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${VERSION} 已存在，版本号未变化，跳过本次构建"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${VERSION} 不存在，开始新构建"
          fi

      - name: 输出跳过说明
        if: steps.gate.outputs.rebuild != 'true'
        run: |
          {
            echo "### ⏭ 已跳过构建"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 目标镜像 | \`${{ steps.gate.outputs.image }}:${{ steps.gate.outputs.version }}\` |"
            echo "| 原因 | Docker Hub 上已存在该版本，版本号未变化 |"
            echo ""
            echo "想重新编译：手动触发本 workflow 并勾选 **force_rebuild**，"
            echo "或者把仓库根目录的 \`VERSION\` 改成新版本号后再触发。"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 以下步骤仅在版本号变化 / 强制重建时执行
      # -----------------------------------------------------------------------

      - name: 释放磁盘空间
        if: steps.gate.outputs.rebuild == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /opt/az /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: 配置 Buildx
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      # 编译环境镜像只装依赖，靠 GHA 层缓存复用，正常情况下几秒钟完成
      - name: 构建编译环境镜像
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          tags: openwrt-build-env:ci
          load: true
          cache-from: type=gha,scope=openwrt-build-env
          cache-to: type=gha,mode=max,scope=openwrt-build-env

      # -----------------------------------------------------------------------
      # 缓存：dl 源码包 + ccache
      #
      # 三个前提，之前全踩反了：
      #
      # 1) ccache 真正的落点是 work/openwrt/.ccache，不是 work/.ccache。
      #    OpenWrt 的 rules.mk 里写着
      #      export CCACHE_DIR := $(if $(CONFIG_CCACHE_DIR),...,$(TOPDIR)/.ccache)
      #    TOPDIR 是源码根目录，这个 export 会覆盖编译环境镜像里
      #    ENV CCACHE_DIR=/build/.ccache 的值。缓存的路径必须是最终落点。
      #
      # 2) actions/cache 的条目「不可变」：key 一旦写过就再也更新不了。
      #    所以 dl（内容稳定）用固定 key，写一次就够；ccache（每次都在追加）
      #    必须用 run_id 做 key，再靠 restore-keys 前缀取最近一份。
      #
      # 3) 保存缓存的步骤必须在编译之后、并且用 always()。见下面的说明。
      # -----------------------------------------------------------------------
      - name: 恢复 dl 源码包缓存
        if: steps.gate.outputs.rebuild == 'true'
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.DL_CACHE_EPOCH }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: 恢复 ccache
        if: steps.gate.outputs.rebuild == 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt/.ccache
          # run_attempt 也要带上：重跑（Re-run）时 run_id 不变，
          # 只用 run_id 的话第二次保存会因为「key 已存在」而报错。
          key: openwrt-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-

      - name: 在容器内编译 OpenWrt
        if: steps.gate.outputs.rebuild == 'true'
        # ⚠ 这个步骤级超时是「缓存能存下来」的关键，不能删。
        #   job 级的 timeout-minutes 一旦触发，GitHub 会直接取消整个作业，
        #   后续步骤（包括保存缓存和上传日志）一个都不会执行 —— 第 1 次构建
        #   跑了 341 分钟被整轮取消、缓存和 make 日志全丢，就是这么来的。
        #   换成小于 job 超时的步骤级超时后，超时只判「本步骤失败」，作业继续
        #   往下走，后面的 always() 步骤就能把已经攒下的缓存和日志存住。
        #   实测有效：第 2 次构建编译跑到 264 分钟撞上这里的 270 分钟超时，
        #   作业照常走完，成功存下 2.0G 的 dl 缓存、并上传了 2.2MB 的 make 日志。
        #
        #   270 → 300：2 核上 264 分钟编不完（138 个包），多挤 30 分钟。
        #   约 7 分钟前置 + 300 分钟编译 = 307，离 job 的 355 还有 48 分钟余量，
        #   足够保存缓存 + 打包推送 + 上传固件。
        #   ⚠ 调这个值时必须保证「前置 + 本步骤 + 收尾」之和 < job 的
        #     timeout-minutes，否则又会退化成 job 级取消、缓存全丢。
        timeout-minutes: 300
        env:
          OPENWRT_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          ./build-openwrt-docker.sh --env-image openwrt-build-env:ci

      # 编译跑完（成功或失败）先检查一下缓存目录，再决定要不要保存。
      # dl 用的是固定 key，一旦把残缺或空的目录写进去，这个 key 就永久毒化了
      # （缓存条目不可变，之后每轮都会少几个包、每轮都重新下），所以必须挡一下：
      # 只有脚本在下载阶段真的跑完之后留下的 .dl-complete 标记存在时才保存。
      - name: 检查缓存目录
        if: always() && steps.gate.outputs.rebuild == 'true'
        id: cache-guard
        run: |
          set -euo pipefail

          # ⚠ 保存缓存之前必须先把「超时后仍在跑的编译容器」杀掉。
          #
          # GitHub 的步骤超时杀掉的是 docker CLI 进程，容器里的 make 并不会停：
          # 它继续往 work/openwrt/.ccache 里写对象，而缓存上传紧接着就开始了。
          # 上一次（run 36368734756）就是这么失败的：
          #     tar: work/openwrt/.ccache/1: file changed as we read it
          #     Failed to save: tar failed with exit code 1
          #     Cache save failed.
          # 264 分钟攒下的 1.1G 编译缓存，一条都没存住。
          #
          # 这里按容器名前缀找残留并清理（脚本用 --name openwrt-build-$$ 启动，
          # --rm 会在容器停止后自动删除，bind mount 的 work/ 不受影响）。
          # 用 rm -f 而不是 kill：rm -f 是「SIGKILL + 移除」，
          # 万一 kill 因为容器状态异常而失败，rm -f 还能兜住。
          leftovers="$(docker ps -q --filter 'name=openwrt-build' 2>/dev/null || true)"
          if [ -n "$leftovers" ]; then
            echo "::warning::发现编译步骤超时后仍在运行的容器，先停止再保存缓存: $leftovers"
            # shellcheck disable=SC2086
            docker rm -f $leftovers || true

            # 确认真的停了再往下走：tar 读的时候目录还在变的话，
            # 缓存保存会直接失败（"file changed as we read it" → exit 1）。
            for _ in 1 2 3 4 5 6; do
              if [ -z "$(docker ps -q --filter 'name=openwrt-build' 2>/dev/null || true)" ]; then
                break
              fi
              sleep 2
            done
            if [ -n "$(docker ps -q --filter 'name=openwrt-build' 2>/dev/null || true)" ]; then
              echo "::error::残留容器仍未停止，本次 ccache 缓存很可能保存失败"
            else
              echo "残留容器已停止，缓存目录已静止"
            fi
          fi

          mkdir -p work/openwrt/.ccache

          if [ -f work/openwrt/.dl-complete ] && [ -n "$(ls -A work/openwrt/dl 2>/dev/null)" ]; then
            echo "dl_ok=true" >> "$GITHUB_OUTPUT"
            echo "dl/ 大小: $(du -sh work/openwrt/dl | cut -f1)"
          else
            echo "dl_ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dl/ 为空或下载阶段没跑完（缺 .dl-complete 标记），跳过保存 dl 缓存，避免毒化固定 key"
          fi

          if [ -n "$(ls -A work/openwrt/.ccache 2>/dev/null)" ]; then
            echo "ccache_ok=true" >> "$GITHUB_OUTPUT"
            echo "ccache/ 大小: $(du -sh work/openwrt/.ccache | cut -f1)"
          else
            echo "ccache_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ccache 目录是空的，没有编译缓存可存 —— 说明 CONFIG_CCACHE 没有生效"
          fi

      - name: 保存 dl 源码包缓存
        if: always() && steps.cache-guard.outputs.dl_ok == 'true' && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.DL_CACHE_EPOCH }}

      - name: 保存 ccache
        if: always() && steps.cache-guard.outputs.ccache_ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: work/openwrt/.ccache
          key: openwrt-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 登录 Docker Hub
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 打包并推送 OpenWrt 系统镜像
        if: steps.gate.outputs.rebuild == 'true'
        env:
          OPENWRT_VERSION: ${{ steps.gate.outputs.version }}
          IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
          # Dockerfile.image 用了 COPY --chmod（保证 entrypoint 可执行位），
          # 这是 BuildKit 专属语法，经典 builder 会报
          # "the --chmod option requires BuildKit"。显式打开更稳。
          DOCKER_BUILDKIT: "1"
        run: |
          ./build-openwrt-docker.sh --package-only --push

      - name: 上传刷机固件
        if: steps.gate.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-${{ steps.gate.outputs.version }}
          path: |
            output/*.img.gz
            output/*rootfs.tar.gz
            output/sha256sums
          if-no-files-found: warn
          retention-days: 30

      # 脚本在 CI 模式下把 make 的完整输出写进了日志文件，
      # 编译失败时把它传上来，否则 Actions 日志里看不到真正的报错。
      #
      # 注意路径：make 日志始终落在 work/openwrt/build-logs/ 下，
      # 只有编译成功、跑过 collect_artifacts 之后才会被复制到 output/。
      # 失败时 output/ 里根本没有 .log，所以两边都要带上
      # （upload-artifact 对匹配不到的路径会自动忽略，不会报错）。
      #
      # 用 (failure() || cancelled()) 而不是单个 failure()：
      # 编译步骤超时属于 failure()，但作业万一被整轮取消（cancelled()），
      # 日志同样需要传上来 —— 上次只能看心跳、看不到 make 输出就是这个原因。
      - name: 上传编译日志（失败或取消时）
        if: (failure() || cancelled()) && steps.gate.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-logs-${{ steps.gate.outputs.version }}
          path: |
            work/openwrt/build-logs/*.log
            output/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: 追加编译摘要
        if: steps.gate.outputs.rebuild == 'true'
        run: |
          if [ -f output/build-summary.md ]; then
            cat output/build-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 发布 GitHub Release
        if: steps.gate.outputs.rebuild == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.img.gz
            output/*rootfs.tar.gz
          generate_release_notes: true

      - name: 输出构建结果
        if: steps.gate.outputs.rebuild == 'true'
        run: |
          {
            echo "### ✅ 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | \`${{ steps.gate.outputs.version }}\` |"
            echo "| 系统镜像 | \`${{ steps.gate.outputs.image }}:${{ steps.gate.outputs.version }}\` |"
            echo "| 镜像别名 | \`${{ steps.gate.outputs.image }}:latest\` |"
            echo ""
            echo "部署："
            echo ""
            echo '```bash'
            echo "cp .env.example .env"
            echo "vi .env   # 填 LAN_PARENT_IFACE 与镜像 tag"
            echo "docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
