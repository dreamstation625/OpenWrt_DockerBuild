###############################################################################
# OpenWrt x86_64 容器化部署
#
# 推荐用 macvlan：容器在局域网里就是一台独立设备，IP 固定 192.168.31.254，
# 不占用宿主机的 80 / 443 / 53 / 67 端口。
#
# 使用前先确认承载网卡名（宿主机执行 ip -br link 查看），填到 .env 的
# LAN_PARENT_IFACE，常见值是 eth0 / ens18 / enp3s0 / br0。
#
#   cp .env.example .env
#   vi .env                 # 改 LAN_PARENT_IFACE / OPENWRT_IMAGE
#   docker compose up -d
#   浏览器打开 http://192.168.31.254
#
# ⚠ 为什么不推荐 host 网络：
#   容器内的 netifd + firewall4 会直接接管宿主机网络栈，把 192.168.31.254
#   配到宿主机网卡上，同时抢占 80/53/67 端口，可能直接把宿主机网络搞挂。
#   除非你非常清楚在做什么，否则别用 host。
#
# 关于 environment：
#   这些变量不是 OpenWrt 自己读的，而是由镜像里的
#   /usr/bin/openwrt-entrypoint.sh 刷进 UCI 后再 exec /sbin/init。
#   生效时机看 OPENWRT_APPLY_ENV，默认是 auto（只在首次启动应用一次）。
###############################################################################

services:
  openwrt:
    image: ${OPENWRT_IMAGE:-dreamstation625/openwrt:latest}
    container_name: ${CONTAINER_NAME:-openwrt}
    hostname: ${OPENWRT_HOSTNAME:-OpenWrt}

    restart: unless-stopped
    stop_grace_period: 15s

    # OpenWrt 需要管理接口、iptables/nftables、DHCP/TFTP 等
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

    # 让容器内的 sysctl 生效（ip_forward 等由 OpenWrt 自己设置）
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"

    # ------------------------------------------------------------------
    # 可覆写的部署参数
    #   auto   （默认）只在首次启动应用一次，之后以 LuCI 里的改动为准
    #   always 每次启动都应用，这里写什么就是什么
    #   never  完全不应用，全部交给 LuCI
    # 例外：ROOT_PASSWORD 每次都设，因为 /etc/shadow 不在持久化卷里，
    #       容器重建后会回到镜像默认值。
    # ------------------------------------------------------------------
    environment:
      OPENWRT_APPLY_ENV: ${OPENWRT_APPLY_ENV:-auto}
      OPENWRT_HOSTNAME: ${OPENWRT_HOSTNAME:-OpenWrt}
      OPENWRT_TIMEZONE: ${OPENWRT_TIMEZONE:-CST-8}
      OPENWRT_ZONENAME: ${OPENWRT_ZONENAME:-Asia/Shanghai}
      LUCI_THEME: ${LUCI_THEME:-argon}
      LUCI_LANG: ${LUCI_LANG:-zh-cn}
      LAN_IP: ${LAN_IP:-192.168.31.254}
      LAN_NETMASK: ${LAN_NETMASK:-255.255.255.0}
      LAN_GATEWAY: ${LAN_GATEWAY:-192.168.31.1}
      LAN_DNS: ${LAN_DNS:-223.5.5.5 119.29.29.29}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-root}
      DOCKER_DATA_ROOT: ${DOCKER_DATA_ROOT:-/opt/docker}

    # ------------------------------------------------------------------
    # 持久化：插件配置全靠这些卷，不挂的话容器一重建配置就没了
    #
    # 用的是命名卷（不是 ./data:/etc/config 这种 bind mount）：
    #   命名卷首次创建时会把镜像里该目录的初始内容复制进去，安全；
    #   bind mount 到宿主机空目录会直接把容器内目录"盖"成空的，
    #   OpenWrt 会因为 /etc/config 为空而启动异常。
    # 想改用 bind mount 方便备份的话，先把容器里的文件拷出来：
    #   docker cp openwrt:/etc/config ./data/config
    # ------------------------------------------------------------------
    volumes:
      # 核心：UCI 配置。绝大多数插件（网络、防火墙、DHCP、MosDNS、
      # AdGuardHome、OpenClash、Dockerman...）的设置都落在这里
      - openwrt-config:/etc/config

      # OpenClash：配置、订阅、规则集，体积大，不持久化每次都要重新下载
      - openwrt-openclash:/etc/openclash

      # LuCI 防火墙自定义规则页写的 nftables 片段
      - openwrt-nftables:/usr/share/nftables.d

      # 容器内 Docker 的数据目录
      - openwrt-docker:${DOCKER_DATA_ROOT:-/opt/docker}

      # 日志与 root 家目录（部分插件会往里写东西）
      - openwrt-log:/var/log
      - openwrt-root:/root

      #
      # 如果发现某个插件的配置还是丢了，往上面加一行即可，例如：
      #
      #   - openwrt-adguardhome:/etc/AdGuardHome
      #   - openwrt-mosdns:/etc/mosdns
      #

    networks:
      lan:
        ipv4_address: ${LAN_IP:-192.168.31.254}

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_IFACE:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-192.168.31.0/24}
          gateway: ${LAN_GATEWAY:-192.168.31.1}
    #
    # 群晖 Container Manager 图形界面不一定能建 macvlan 网络。
    # 如果已经用命令行手工建好了（docker network create -d macvlan ...），
    # 就改成引用外部网络，别让 compose 再建一次：
    #
    #   external: true
    #   name: openwrt-lan

volumes:
  openwrt-config:
  openwrt-openclash:
  openwrt-nftables:
  openwrt-docker:
  openwrt-log:
  openwrt-root:
  # openwrt-adguardhome:
  # openwrt-mosdns:
