###############################################################################
# OpenWrt x86_64 容器化部署
#
# 推荐用 macvlan：容器在局域网里就是一台独立设备，IP 固定 192.168.31.254，
# 不占用宿主机的 80 / 443 / 53 / 67 端口。
#
# 使用前先确认承载网卡名（宿主机执行 ip -br link 查看），填到 .env 的
# LAN_PARENT_IFACE，常见值是 eth0 / ens18 / enp3s0 / br0。
#
#   cp .env.example .env
#   vi .env                 # 改 LAN_PARENT_IFACE / OPENWRT_IMAGE / DATA_DIR
#   ./docker/init-volumes.sh   # 可选：预先把默认配置取到 ./data
#   docker compose up -d
#   浏览器打开 http://192.168.31.254
#
# 持久化数据都在 ./data（可用 .env 的 DATA_DIR 改到别处），
# 备份就是整个目录打包拷走。
#
# ⚠ 为什么不推荐 host 网络：
#   容器内的 netifd + firewall4 会直接接管宿主机网络栈，把 192.168.31.254
#   配到宿主机网卡上，同时抢占 80/53/67 端口，可能直接把宿主机网络搞挂。
#   除非你非常清楚在做什么，否则别用 host。
#
# 关于 environment：
#   这些变量不是 OpenWrt 自己读的，而是由镜像里的
#   /usr/bin/openwrt-entrypoint.sh 刷进 UCI 后再 exec /sbin/init。
#   生效时机看 OPENWRT_APPLY_ENV，默认是 auto（只在首次启动应用一次）。
###############################################################################

services:
  openwrt:
    image: ${OPENWRT_IMAGE:-dreamstation625/openwrt:latest}
    container_name: ${CONTAINER_NAME:-openwrt}
    hostname: ${OPENWRT_HOSTNAME:-OpenWrt}

    restart: unless-stopped
    stop_grace_period: 15s

    # OpenWrt 需要管理接口、iptables/nftables、DHCP/TFTP 等
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

    # 让容器内的 sysctl 生效（ip_forward 等由 OpenWrt 自己设置）
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"

    # ------------------------------------------------------------------
    # 可覆写的部署参数
    #   auto   （默认）只在首次启动应用一次，之后以 LuCI 里的改动为准
    #   always 每次启动都应用，这里写什么就是什么
    #   never  完全不应用，全部交给 LuCI
    # 例外：ROOT_PASSWORD 每次都设，因为 /etc/shadow 不在持久化卷里，
    #       容器重建后会回到镜像默认值。
    # ------------------------------------------------------------------
    environment:
      OPENWRT_APPLY_ENV: ${OPENWRT_APPLY_ENV:-auto}
      OPENWRT_HOSTNAME: ${OPENWRT_HOSTNAME:-OpenWrt}
      OPENWRT_TIMEZONE: ${OPENWRT_TIMEZONE:-CST-8}
      OPENWRT_ZONENAME: ${OPENWRT_ZONENAME:-Asia/Shanghai}
      LUCI_THEME: ${LUCI_THEME:-argon}
      LUCI_LANG: ${LUCI_LANG:-zh-cn}
      LAN_IP: ${LAN_IP:-192.168.31.254}
      LAN_NETMASK: ${LAN_NETMASK:-255.255.255.0}
      LAN_GATEWAY: ${LAN_GATEWAY:-192.168.31.1}
      LAN_DNS: ${LAN_DNS:-223.5.5.5 119.29.29.29}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-root}

    # ------------------------------------------------------------------
    # 持久化：插件配置全靠这些卷，不挂的话容器一重建配置就没了
    #
    # 用的是 bind mount（挂载到当前目录下的 data/），备份/迁移直接拷目录即可。
    # 根目录由 DATA_DIR 控制，默认 ./data；想放到别处就在 .env 里改，
    # 例如群晖：DATA_DIR=/volume1/docker/openwrt-data
    #
    # ⚠ bind mount 不像命名卷那样会自动带入镜像内容：宿主机目录为空时，
    #   挂上去会把容器内目录"盖"成空的，/etc/config 一空 OpenWrt 就起不来。
    #   镜像里的 entrypoint 已内置兜底（检测到空目录就从内置默认配置恢复），
    #   所以直接 up 也没问题。想提前看到默认配置可以跑：
    #     ./docker/init-volumes.sh
    #
    # ⚠ 权限：容器内以 root 写入，宿主机上这些文件属主是 root。
    #   备份/编辑用 root 或 sudo，别用普通用户改完再指望容器读得到。
    # ------------------------------------------------------------------
    volumes:
      # 核心：UCI 配置。绝大多数插件（网络、防火墙、DHCP、MosDNS、
      # AdGuardHome、OpenClash 等）的设置都落在这里
      - ${DATA_DIR:-./data}/config:/etc/config

      # OpenClash：配置、订阅、规则集，体积大，不持久化每次都要重新下载
      - ${DATA_DIR:-./data}/openclash:/etc/openclash

      # AdGuard Home（官方 adguardhome 包的路径，全小写）
      #   /etc/adguardhome    → 配置文件 adguardhome.yaml
      #   /var/lib/adguardhome → 过滤规则、查询日志、统计数据库
      # 后者尤其要挂：/var 是指向 /tmp 的符号链接而在 tmpfs 里，不挂的话
      # 每次重启 AdGuard Home 都要重建数据
      - ${DATA_DIR:-./data}/adguardhome:/etc/adguardhome
      - ${DATA_DIR:-./data}/adguardhome-data:/var/lib/adguardhome

      # MosDNS：分流规则与自定义配置
      - ${DATA_DIR:-./data}/mosdns:/etc/mosdns

      # LuCI 防火墙自定义规则页写的 nftables 片段
      - ${DATA_DIR:-./data}/nftables.d:/usr/share/nftables.d

      # root 家目录（部分插件会往里写状态、SSH key 等）
      - ${DATA_DIR:-./data}/root:/root

      # 日志。注意 OpenWrt 里 /var 是指向 /tmp 的符号链接，而 /tmp 是 tmpfs，
      # 系统日志默认仍在内存里，重启即丢。要真正持久化需在 LuCI
      # 「系统 → 系统日志」把输出改到持久化路径。
      - ${DATA_DIR:-./data}/log:/var/log

      #
      # 如果发现某个插件的配置还是丢了，照格式往上面加一行即可，例如：
      #
      #   - ${DATA_DIR:-./data}/ddns-go:/etc/ddns-go
      #   - ${DATA_DIR:-./data}/v2ray:/etc/v2ray
      #

    networks:
      lan:
        ipv4_address: ${LAN_IP:-192.168.31.254}

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_IFACE:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-192.168.31.0/24}
          gateway: ${LAN_GATEWAY:-192.168.31.1}
    #
    # 群晖 Container Manager 图形界面不一定能建 macvlan 网络。
    # 如果已经用命令行手工建好了（docker network create -d macvlan ...），
    # 就改成引用外部网络，别让 compose 再建一次：
    #
    #   external: true
    #   name: openwrt-lan

# 持久化用的是 bind mount（上面的 ./data/...），所以不再声明命名卷。
#
# 想改回命名卷的话，把 volumes 里的 ${DATA_DIR:-./data}/config 换成
# openwrt-config 之类，并在这里声明：
#
# volumes:
#   openwrt-config:
#   openwrt-openclash:
#   openwrt-adguardhome:
#   openwrt-mosdns:
#   openwrt-nftables:
#   openwrt-log:
#   openwrt-root:
